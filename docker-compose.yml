name: moviestreaming

services:
  db:
    image: ${DB_IMAGE}
    entrypoint:
      - /bin/bash
      - -c
      - export MSSQL_SA_PASSWORD="$$(cat /run/secrets/mssql_sa_password)" && exec /opt/mssql/bin/launch_sqlservr.sh /opt/mssql/bin/sqlservr
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
    secrets:
      - mssql_sa_password
    volumes:
      - db-data:/var/opt/mssql
    networks:
      - backend
    healthcheck:
      test:
        - CMD
        - /bin/bash
        - -c
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$(cat /run/secrets/mssql_sa_password)" -C -Q "SELECT 1"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: always
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          memory: 1G
      restart_policy:
        condition: any
        delay: 5s
        window: 60s
      update_config:
        parallelism: 1
        delay: 10s
        order: stop-first
        failure_action: rollback
      rollback_config:
        parallelism: 1
        delay: 5s
        order: stop-first

  db-init:
    image: ${DB_IMAGE}
    depends_on:
      db:
        condition: service_healthy
    entrypoint:
      - /bin/bash
      - -c
      - /opt/mssql-tools18/bin/sqlcmd -S db -U sa -P "$$(cat /run/secrets/mssql_sa_password)" -C -b -i /etc/moviestreaming/init.sql
    secrets:
      - mssql_sa_password
    configs:
      - source: db_init_script
        target: /etc/moviestreaming/init.sql
    networks:
      - backend
    restart: "no"
    security_opt:
      - no-new-privileges:true

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${API_IMAGE}
    depends_on:
      db-init:
        condition: service_completed_successfully
    env_file:
      - env/api.env
    secrets:
      - source: movie_db_connection
        target: ConnectionStrings__MovieDb
    ports:
      - "${API_PORT}:8080"
    networks:
      - frontend
      - backend
    healthcheck:
      test:
        - CMD
        - /bin/bash
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf "GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 && head -1 <&3 | grep -q "200 OK"'
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: always
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 128M
      restart_policy:
        condition: any
        delay: 5s
        window: 60s
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
      rollback_config:
        parallelism: 1
        delay: 5s
        order: stop-first

volumes:
  db-data:

networks:
  frontend:
  backend:
    internal: true

secrets:
  mssql_sa_password:
    file: ./secrets/mssql_sa_password.txt
  movie_db_connection:
    file: ./secrets/movie_db_connection.txt

configs:
  db_init_script:
    file: ./db/init.sql
